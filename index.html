return `<article class="feed-card"><div class="feed-inner"><div class="row"><div class="public-identity"><div class="identity-dot">${company?'🏢':'👤'}</div><div><b>${author}</b><div class="feed-meta">${p.time} · ${company?'Firmenanzeige':'Privater Beitrag'}</div></div></div>${showRating}</div><div class="feed-title">${p.emoji} ${p.title}</div><p class="intro">${p.body}</p><div class="actionRow"><button class="smallbtn ${demo.joined.includes(p.id)?'selected':''}" onclick="join('${p.id}')">${demo.joined.includes(p.id)?'✓ Interesse vorgemerkt':p.action}</button><button class="smallbtn" onclick="go('${p.kind}')">Baustein ansehen</button></div></div></article>`}

function join(id){if(!demo.joined.includes(id))demo.joined.push(id);else demo.joined=demo.joined.filter(v=>v!==id);saveDemo();render()}
function feed(){return baseView('Neues aus deiner Nähe',`<p class="muted">Beispiele aus Nordrhein-Westfalen. Alle Mitglieder, Beiträge und Reaktionen sind zu Demonstrationszwecken erfunden. „Anzeige“ kennzeichnet gewerbliche Inhalte.</p><button class="btn alt" onclick="go('activity')">+ Unternehmung ansehen</button>${posts.map(postCard).join('')}`)}
function profile(){return baseView('Mein Profil',`<div class="card soft"><div class="row"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">👤</div><div><b>Max · Wuppertal</b><div class="muted">NRW-000123</div><div class="verified">✓ Verifiziert (nur Testdarstellung)</div></div></div></div><p class="muted">Das sind ausschließlich Beispieldaten. Keine echte Identitätsprüfung.</p></div><div class="profile-actions"><button class="btn" onclick="go('editprofile')">✏️ Mein Profil bearbeiten</button><button class="btn alt" onclick="go('previewprofile')">👁️ So sehen andere mein Profil</button><button class="btn alt" onclick="go('activity')">📅 Meine Aktivitäten</button><button class="btn alt" onclick="state.person='Max';go('ratings')">⭐ Meine Bewertungen</button><button class="btn" style="background:#148b6c" onclick="go('events')">🎉 Ich möchte etwas unternehmen!</button></div>`)}
function editProfile(){return baseView('Mein Profil bearbeiten',`<p class="muted">Dein Text und deine Interessen lassen sich für die Vorführung ändern. Sie bleiben nur lokal in diesem Browser gespeichert.</p><label><b>Über mich</b></label><textarea id="bio" class="field" rows="4">${escapeHtml(demo.myBio)}</textarea><b>Meine Interessen</b><div class="choices">${['Spazieren','Kochen','Tanzen','Tiere','Helfen','Reisen','Spiele','Kultur','Sport'].map(t=>`<label><input type="checkbox" data-interest="${t}" ${demo.myTags.includes(t)?'checked':''}> ${t}</label>`).join('')}</div><label class="setting">Stadt anderen Mitgliedern anzeigen <input type="checkbox" id="sc" ${demo.showCity?'checked':''}></label><label class="setting">Über mich anzeigen <input type="checkbox" id="sb" ${demo.showBio?'checked':''}></label><label class="setting">Interessen anzeigen <input type="checkbox" id="st" ${demo.showTags?'checked':''}></label><p class="muted">Fotos: In dieser Demoversion nur Platzhalter. Später höchstens zwei selbst ausgewählte Bilder.</p><div class="actionRow"><button class="btn" onclick="saveProfile()">Speichern und Vorschau ansehen</button><button class="btn alt" onclick="go('profile')">Abbrechen</button></div>`)}
function saveProfile(){demo.myBio=document.getElementById('bio').value;demo.myTags=[...document.querySelectorAll('[data-interest]:checked')].map(e=>e.dataset.interest);demo.showCity=document.getElementById('sc').checked;demo.showBio=document.getElementById('sb').checked;demo.showTags=document.getElementById('st').checked;saveDemo();go('previewprofile')}
function previewProfile(){return baseView('So sehen mich andere',`<div class="card"><div class="row"><div class="avatar">👤</div><div style="flex:1"><b>Max</b><div class="muted">${demo.showCity?'Wuppertal · ':''}NRW-000123</div></div>${reviewLink('Max','–',0)}</div>${demo.showBio?`<p class="intro">${escapeHtml(demo.myBio)}</p>`:''}${demo.showTags?`<div class="chips">${demo.myTags.map(t=>`<span class="chip">${t}</span>`).join('')}</div>`:''}<span class="pill">Kontakt nur nach Zustimmung</span></div><div class="notice">Verifizierungsdaten, Anschrift, E-Mail und genaue Standorte sind nicht für andere sichtbar.</div><div class="actionRow"><button class="btn" onclick="go('events')">Ich möchte etwas unternehmen!</button><button class="btn alt" onclick="go('editprofile')">Noch etwas ändern</button></div>`)}
function ratingsPage(){let p=state.person||'Max',r=reviews[p]||[];return baseView('Erfahrungen mit einem Mitglied',`<button class="back" onclick="go('feed')">← Zurück zu Neuigkeiten</button><div class="card"><div class="row"><b>⭐ ${p==='Max'?'Noch keine':r.length+' beispielhafte'} Bewertungen</b><span class="pill">Testdaten</span></div><p class="muted">Sterne sind anklickbar. Bewertungen bestehen aus Punkten und begründeten Erfahrungen. Später erst nach bestätigter gemeinsamer Aktivität möglich.</p></div>${r.length?r.map(([name,text,stars])=>`<div class="card"><b>Verifiziertes Mitglied</b><div style="color:#bd811d">${'★'.repeat(stars)}</div><p>${escapeHtml(text)}</p><small class="muted">Demonstration · fiktive Rückmeldung</small></div>`).join(''):'<div class="empty">Dieses Testprofil hat noch keine Bewertungen.</div>'}`)}
function activity(){return baseView('Meine Aktivitäten',`<p class="muted">Hier erscheinen zugesagte Unternehmungen, Anfragen und Kochrunden.</p>${demo.joined.length?demo.joined.map(id=>{let p=posts.find(x=>x.id===id);return p?`<div class="card"><b>${p.emoji} ${p.title}</b><p class="muted">Interesse vorgemerkt · Bestätigung steht aus</p></div>`:''}).join(''):'<div class="empty">Noch keine Interessen vorgemerkt.</div>'}<button class="btn" onclick="go('events')">Unternehmungen entdecken</button>`)}
// Kochrunden V26: getrennte Demodaten pro Gruppe und keine Synchronisierung mit anderen Geräten.
function cookRounds(){
 if(!Array.isArray(demo.cookRounds)){
  demo.cookRounds=[
   {id:'runde-barmen',title:'Genussrunde Barmen',area:'Wuppertal-Barmen',host:'Mitglied aus Barmen',theme:'Bunt & international',members:['Gastgeber/in','Gast 2','Gast 3','Gast 4'],applications:[],evenings:[0,1,2,3].map(()=>({menu:'',done:false,reviews:[]})),chat:[],meeting:'',meetingApproved:false},
   {id:'runde-elberfeld',title:'Feierabend-Küche',area:'Wuppertal-Elberfeld',host:'Mitglied aus Elberfeld',theme:'Einfach, lecker, gemütlich',members:['Gastgeber/in','Gast 2','Gast 3'],applications:[],evenings:[0,1,2,3].map(()=>({menu:'',done:false,reviews:[]})),chat:[],meeting:'',meetingApproved:false},
   {id:'runde-remscheid',title:'Viermal gemeinsam genießen',area:'Remscheid',host:'Mitglied aus Remscheid',theme:'Hobbyköche willkommen',members:['Gastgeber/in'],applications:[],evenings:[0,1,2,3].map(()=>({menu:'',done:false,reviews:[]})),chat:[],meeting:'',meetingApproved:false}
  ];
  if(demo.cookRound && Array.isArray(demo.cookRound.evenings))demo.cookRounds[0].evenings=demo.cookRound.evenings;
  saveDemo();
 }
 return demo.cookRounds;
}
function activeCook(){let rs=cookRounds();return rs.find(r=>r.id===state.cookId)||rs[0]}
function cookPick(id){state.cookId=id;go('cookGroup')}
function cookCount(r){return r.members.length}
function cookReady(r){return r.members.length===4}
function cookingPage(){let rr=cookRounds();return baseView('Gemeinsam kochen',`<div class="card soft"><div style="font-size:34px">🍝</div><h3>Vier Abende – vier Gastgeber</h3><p>Vier Menschen, vier Monate, vier schöne Kochabende. Eine Person gründet die Runde und entscheidet, wer mitmacht.</p><div class="chips"><span class="chip">👥 4 Personen</span><span class="chip">📆 1 Abend pro Monat</span><span class="chip">🔒 Bewertungen erst zum Finale</span></div><button class="btn" onclick="go('cookCreate')">+ Meine Kochrunde gründen</button></div><h3>Entdecke Kochrunden in deiner Nähe</h3>${rr.map(r=>`<div class="card"><div class="row"><b>🍽️ ${escapeHtml(r.title)}</b><span class="pill">${cookReady(r)?'Runde läuft':(4-cookCount(r))+' Plätze frei'}</span></div><p class="muted">📍 ${escapeHtml(r.area)} · ${escapeHtml(r.theme)}</p><p><b>${cookCount(r)} von 4 Teilnehmern</b> · ${r.evenings.filter(e=>e.done).length} von 4 Kochabenden</p><div class="actionRow"><button class="btn" onclick="cookPick('${r.id}')">${cookReady(r)?'Kochrunde ansehen':'Details & bewerben'}</button></div></div>`).join('')}<div class="notice">Demo: Alle Gruppen und Bewerbungen werden nur auf diesem Gerät gespeichert. Es findet noch keine echte Bewerbung oder Terminübertragung statt.</div>`)}
function cookCreatePage(){return baseView('Kochrunde gründen',`<button class="back" onclick="go('cooking')">← Zu den Kochrunden</button><div class="card"><h3>Meine neue Kochrunde</h3><label><b>Name der Runde</b></label><input class="field" id="cookTitle" maxlength="65" placeholder="Zum Beispiel: Gemeinsam lecker kochen"><label><b>Ungefähre Gegend</b></label><input class="field" id="cookArea" maxlength="65" placeholder="Zum Beispiel: Wuppertal-Barmen"><label><b>Was ist euch wichtig?</b></label><textarea class="field" id="cookTheme" rows="3" maxlength="250" placeholder="Gemütliche Abende, auch für Anfänger …"></textarea><button class="btn" onclick="createCookRound()">Kochrunde in der Demo eröffnen</button><p class="muted">Die genaue Wohnadresse ist nicht öffentlich sichtbar. Es entstehen keine echten Konten oder Gruppen.</p></div>`)}
function createCookRound(){let title=document.getElementById('cookTitle').value.trim(),area=document.getElementById('cookArea').value.trim(),theme=document.getElementById('cookTheme').value.trim();if(!title||!area)return alert('Bitte einen Namen und eine ungefähre Gegend eingeben.');let r={id:'runde-'+Date.now(),title,area,theme:theme||'Gemeinsam kochen und kennenlernen',host:'Ich (Demo)',members:['Ich (Gründer/in)'],applications:[],evenings:[0,1,2,3].map(()=>({menu:'',done:false,reviews:[]})),chat:[],meeting:'',meetingApproved:false};cookRounds().unshift(r);saveDemo();state.cookId=r.id;go('cookGroup')}
function cookGroupPage(){let r=activeCook(),ready=cookReady(r),progress=r.evenings.filter(e=>e.done).length;return baseView('Unsere Kochrunde',`<button class="back" onclick="go('cooking')">← Alle Kochrunden</button><div class="card soft"><h3>🍽️ ${escapeHtml(r.title)}</h3><p>📍 ${escapeHtml(r.area)} · ${escapeHtml(r.theme)}</p><p><b>${cookCount(r)} von 4 Teilnehmenden</b> · ${ready?'Runde vollständig':'Noch '+(4-cookCount(r))+' Plätze frei'}</p><p>${progress} von 4 Kochabenden abgeschlossen</p><div class="chips">${r.members.map((x,i)=>`<span class="chip">${i+1}. ${escapeHtml(x)}</span>`).join('')}</div></div>${!ready?`<div class="card"><h3>Bei dieser Runde bewerben</h3><label><b>Kurze Vorstellung (nur Demo)</b></label><textarea class="field" id="cookApplication" rows="2" placeholder="Ich koche gerne und hätte Lust mitzumachen …"></textarea><div class="actionRow"><button class="btn" onclick="applyCook()">Ich will auch! – Bewerbung senden</button><button class="btn alt" onclick="simulateCookApplicant()">Testbewerbung hinzufügen</button></div><p class="muted">Der Gründer wählt die drei weiteren Personen aus. Nur freigegebene Mitglieder werden Teil der Gruppe.</p></div><div class="card"><h3>Bewerbungen (${r.applications.length})</h3>${r.applications.length?r.applications.map(a=>`<div style="padding:12px 0;border-bottom:1px solid #e1e7ee"><b>${escapeHtml(a.name)}</b><p>${escapeHtml(a.text)}</p><div class="actionRow"><button class="btn" onclick="acceptCookApplicant('${a.id}')">Aufnehmen</button><button class="btn alt" onclick="declineCookApplicant('${a.id}')">Ablehnen</button></div></div>`).join(''):'<p class="muted">Noch keine Bewerbungen. Mit „Testbewerbung hinzufügen“ kannst du den Ablauf ausprobieren.</p>'}</div>`:`<div class="notice">✅ Alle vier Plätze sind vergeben. Hier beginnen die vier gemeinsamen Abende – etwa einer pro Monat.</div>`}<div class="card"><h3>Vier Abende, vier Gastgeber</h3>${r.evenings.map((e,i)=>`<div style="border-top:1px solid #e1e7ee;padding:12px 0"><b>Monat ${i+1}: ${escapeHtml(r.members[i]||'Noch offen')}</b><p class="muted">${e.done?'✓ Abend abgeschlossen':'Noch nicht abgeschlossen'} · ${e.reviews.length}/3 Gästebewertungen eingegangen</p>${e.menu?`<p><b>Menü:</b> ${escapeHtml(e.menu)}</p>`:'<p class="muted">Das Menü wird noch vorbereitet.</p>'}<div class="actionRow"><button class="btn alt" ${!ready?'disabled':''} onclick="state.cookEvening=${i};go('cookMenu')">Menü ansehen / eintragen</button><button class="btn alt" ${!ready?'disabled':''} onclick="state.cookEvening=${i};go('cookingScore')">Bewerten</button>${!e.done?`<button class="btn alt" ${!ready?'disabled':''} onclick="finishCookEvening(${i})">Abend abschließen</button>`:''}</div></div>`).join('')}</div><div class="card"><h3>💬 Gruppenchat & Treffpunkt</h3><p class="muted">Nur für die vier Personen der Kochrunde (in dieser Demo auf einem Gerät simuliert).</p><button class="btn" ${!ready?'disabled':''} onclick="go('cookChat')">Gruppenchat und Google Maps öffnen</button></div><div class="card soft"><h3>${progress===4?'🎉 Unser Finale':'🔒 Bewertungen sind noch geheim'}</h3><p>${progress===4?'Erst jetzt können die vier Teilnehmer die Ergebnisse nachlesen. Private Hinweise erscheinen niemals im Finale.':'Punkte und schriftliche Begründungen bleiben bis zum Abschluss des vierten Abends gesperrt. Öffentlich kann nur der Fortschritt der Runde erscheinen.'}</p>${progress===4?`<button class="btn" onclick="go('cookFinale')">Ergebnisse ansehen</button>`:''}</div><button class="btn alt" onclick="resetCookRound()">Nur diese Demo-Kochrunde zurücksetzen</button>`)}
function applyCook(){let r=activeCook(),txt=document.getElementById('cookApplication').value.trim();if(!txt)return alert('Bitte stelle dich mit einem Satz kurz vor.');if(r.applications.some(a=>a.name==='Ich (Bewerbung)'))return alert('Deine Testbewerbung liegt bereits vor.');r.applications.push({id:'a'+Date.now(),name:'Ich (Bewerbung)',text:txt});saveDemo();go('cookGroup')}
function simulateCookApplicant(){let r=activeCook();let names=['Mitglied aus der Nachbarschaft','Hobbyköchin aus der Region','Kochanfänger aus der Umgebung','Freizeitkoch aus NRW'];r.applications.push({id:'a'+Date.now()+'-'+Math.random().toString(36).slice(2,5),name:names[r.applications.length%names.length],text:'Ich möchte gern mitmachen und bin bereit, einen Abend auszurichten.'});saveDemo();render()}
function acceptCookApplicant(id){let r=activeCook(),a=r.applications.find(x=>x.id===id);if(!a)return;if(cookReady(r))return alert('Die Runde ist bereits voll.');if(r.members.includes(a.name))return alert('Dieses Testmitglied ist bereits aufgenommen.');r.members.push(a.name);r.applications=r.applications.filter(x=>x.id!==id);saveDemo();render()}
function declineCookApplicant(id){let r=activeCook();r.applications=r.applications.filter(a=>a.id!==id);saveDemo();render()}
function resetCookRound(){if(!confirm('Nur diese Kochrunde zurücksetzen? Ihre Bewertungen und Nachrichten werden gelöscht.'))return;let r=activeCook();r.evenings=[0,1,2,3].map(()=>({menu:'',done:false,reviews:[]}));r.chat=[];r.meeting='';r.meetingApproved=false;saveDemo();render()}
function cookMenuPage(){let r=activeCook(),i=state.cookEvening||0,e=r.evenings[i];return baseView('Menü für Kochabend '+(i+1),`<button class="back" onclick="go('cookGroup')">← Zurück zur Kochrunde</button><div class="card"><h3>${escapeHtml(r.members[i]||'Gastgeber/in')} · Monat ${i+1}</h3><p>Das Menü kann vorab allen vier Teilnehmenden gezeigt werden. Bitte Allergien und Unverträglichkeiten vorher absprechen.</p><textarea id="cookMenuText" class="field" rows="5" placeholder="Vorspeise, Hauptgang, Dessert, Zutaten und Allergene …">${escapeHtml(e.menu||'')}</textarea><button class="btn" onclick="saveCookMenu(${i})">Menü für die Gruppe speichern</button></div>`)}
function saveCookMenu(i){let v=document.getElementById('cookMenuText').value.trim();if(!v)return alert('Bitte ein Menü eingeben.');activeCook().evenings[i].menu=v;saveDemo();go('cookGroup')}
function cookingScore(){let r=activeCook(),i=state.cookEvening||0,e=r.evenings[i],others=[0,1,2,3].filter(x=>x!==i&&!e.reviews.some(v=>v.guest===x));return baseView('Kochabend bewerten',`<button class="back" onclick="go('cookGroup')">← Zurück zur Kochrunde</button><div class="notice">🔒 Drei Gäste bewerten. Essen und Atmosphäre: je 1–5 Punkte mit schriftlicher Begründung. Punkte und Begründungen bleiben bis zum Ende des vierten Abends verborgen.</div><div class="card"><h3>Abend ${i+1} · ${escapeHtml(r.members[i])}</h3><p class="muted">${e.reviews.length}/3 Bewertungen abgegeben</p>${others.length?`<label><b>Welcher Gast bewertet?</b></label><select class="field" id="cookGuest">${others.map(g=>`<option value="${g}">${escapeHtml(r.members[g])}</option>`).join('')}</select><label><b>Essen</b></label><select id="food" class="field">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} von 5 Punkten</option>`).join('')}</select><label><b>Atmosphäre</b></label><select id="mood" class="field">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} von 5 Punkten</option>`).join('')}</select><label><b>Warum diese Bewertung?</b></label><textarea class="field" id="cookReason" rows="3" placeholder="Eine ehrliche und freundliche Begründung (Pflichtfeld)"></textarea><label><b>Vertraulicher Hinweis (optional)</b></label><textarea class="field" id="cookPrivate" rows="3" placeholder="Wird nicht im Finale angezeigt. Bitte keine echten persönlichen Informationen eingeben."></textarea><button class="btn" onclick="submitCookScore(${i})">Bewertung speichern</button>`:'<p>Alle drei Gäste haben bereits bewertet.</p>'}</div>`)}
function submitCookScore(i){let e=activeCook().evenings[i],g=Number(document.getElementById('cookGuest').value),reason=document.getElementById('cookReason').value.trim();if(!reason)return alert('Bitte begründe deine Bewertung.');if(e.reviews.some(x=>x.guest===g))return alert('Bereits bewertet.');e.reviews.push({guest:g,food:Number(document.getElementById('food').value),mood:Number(document.getElementById('mood').value),reason,privateNote:document.getElementById('cookPrivate').value.trim()});saveDemo();go('cookGroup')}
function finishCookEvening(i){let r=activeCook(),e=r.evenings[i];if(!e.menu)return alert('Bitte zuerst das Menü eintragen.');if(e.reviews.length!==3)return alert('Alle drei Gäste müssen ihre Bewertung abgeben.');if(i>0&&!r.evenings[i-1].done)return alert('Bitte vorherigen Kochabend abschließen.');e.done=true;saveDemo();render()}
function cookFinalePage(){let r=activeCook();if(!r.evenings.every(e=>e.done))return baseView('Koch-Finale','<div class="notice">🔒 Die Bewertungen bleiben noch verborgen.</div><button class="btn" onclick="go(\'cookGroup\')">Zurück</button>');return baseView('Unser Koch-Finale',`<button class="back" onclick="go('cookGroup')">← Zurück zur Kochrunde</button><div class="card soft"><h3>🎉 Alle vier Abende geschafft!</h3><p>Die Bewertungen sind nun in dieser Gruppe freigeschaltet. Vertrauliche Hinweise bleiben verborgen. Keine öffentliche Rangliste.</p></div>${r.evenings.map((e,i)=>`<div class="card"><h3>Abend ${i+1} · ${escapeHtml(r.members[i])}</h3><p><b>Essen:</b> ${(e.reviews.reduce((n,v)=>n+v.food,0)/3).toFixed(1).replace('.',',')}/5 · <b>Atmosphäre:</b> ${(e.reviews.reduce((n,v)=>n+v.mood,0)/3).toFixed(1).replace('.',',')}/5</p>${e.reviews.map(v=>`<p class="muted">${escapeHtml(r.members[v.guest])}: ${escapeHtml(v.reason)}</p>`).join('')}</div>`).join('')}`)}
function cookChatPage(){let r=activeCook();if(!cookReady(r))return baseView('Gruppenchat','<div class="notice">Der Gruppenchat öffnet nach Aufnahme aller vier Personen.</div>');return baseView('Gruppenchat & Google Maps',`<button class="back" onclick="go('cookGroup')">← Zurück zur Kochrunde</button><div class="card"><h3>💬 Unser Gruppenchat</h3><p class="muted">Testchat für die vier Gruppenmitglieder. Nachrichten werden nicht verschickt.</p>${r.chat.length?r.chat.map(m=>`<div class="card" style="margin:8px 0;background:#eff6ff"><b>${escapeHtml(m.who)}:</b> ${escapeHtml(m.text)}</div>`).join(''):'<p class="muted">Hier könnt ihr Termine und gemeinsame Unternehmungen absprechen.</p>'}<textarea class="field" id="cookChatText" rows="2" placeholder="Nachricht für die Gruppe …"></textarea><button class="btn" onclick="sendCookChat()">Demo-Nachricht hinzufügen</button></div><div class="card"><h3>📍 Treffpunkt & Google Maps</h3><p>Vor einer privaten Freigabe ist nur die ungefähre Gegend sichtbar: <b>${escapeHtml(r.area)}</b>.</p><button class="btn alt" onclick="openCookMap(false)">Gegend auf Google Maps ansehen</button><p class="muted">Nur der Gastgeber kann einen Treffpunkt freiwillig freigeben. Für echte Mitglieder sind dafür getrennte Berechtigungen notwendig.</p><input id="cookMeeting" class="field" value="${escapeHtml(r.meeting||'')}" placeholder="Öffentlicher Treffpunkt, z. B. ein Bahnhof"><label class="setting"><span>Ich gebe diesen Treffpunkt ausdrücklich frei</span><input id="cookMeetConsent" type="checkbox" ${r.meetingApproved?'checked':''}></label><button class="btn" onclick="saveCookMeeting()">Treffpunktfreigabe speichern (Demo)</button>${r.meetingApproved?`<p class="verified">✓ Treffpunkt freigegeben: ${escapeHtml(r.meeting)}</p><button class="btn" onclick="openCookMap(true)">Route zum Treffpunkt in Google Maps</button>`:''}</div><button class="btn alt" onclick="go('cookGroup')">← Zurück zur Kochrunde</button>`)}

function saveCookMeeting(){let r=activeCook(),v=document.getElementById('cookMeeting').value.trim(),ok=document.getElementById('cookMeetConsent').checked;if(ok&&!v)return alert('Bitte einen Treffpunkt eintragen.');r.meeting=v;r.meetingApproved=ok;saveDemo();render()}

ce">Hinweis: „Annahme simulieren“ stellt die Reaktion einer erfundenen Person nur für die Vorführung nach. In der späteren echten App kann ausschließlich das angefragte Mitglied zustimmen.</div><button class="btn" onclick="go('members')">Menschen kennenlernen</button></section>`};

function tripCard(t){const left=Math.max(0,Number(t.max||0)-Number(t.booked||0));return `<div class="trip-card"><div><span class="trip-pill">${escapeHtml(t.type)}</span><span class="trip-pill">${t.own?'Meine Aktivität':'Mitglied aus '+escapeHtml(t.city)}</span></div><h3>${escapeHtml(t.title)}</h3><div class="trip-meta">📍 ${escapeHtml(t.city)} · 📅 ${escapeHtml(tripDate(t.date))}<br>👥 ${t.unlimited?'Offene Teilnehmerzahl':left+' von '+t.max+' Plätzen frei'} ${t.status==='cancelled'?'· Abgesagt':''}</div><p>${escapeHtml(t.description)}</p><div class="trip-row"><button class="trip-btn" onclick="tripOpen('${t.id}')">${t.own?'Meine Aktivität verwalten':'Aktivität ansehen'}</button></div></div>`}
function tripsPage(){const groups=['Alle','Sport & Bewegung','Ausflug & Mitfahrt','Spaziergang','Kultur & Freizeit','Essen & Trinken','Sonstiges'];return `<section class="screen"><div class="trip-hero"><h2>🚶 Gemeinsam unterwegs</h2><p>Ob Joggen, Schwimmen, Spaziergang oder Ausflug: Finde Menschen, die mitmachen möchten.</p></div><div class="notice">🔒 Nur fiktive Beispielmitglieder. Vor einer gegenseitigen Zustimmung werden keine Namen oder genauen Privatadressen gezeigt.</div><div class="trip-row"><button class="trip-btn" onclick="tripForm=!tripForm;render()">＋ Aktivität erstellen</button><button class="trip-btn secondary" onclick="tripFilter='Meine';render()">Meine Aktivitäten</button></div>${tripForm?`<div class="trip-card"><h3>Neue Aktivität (Demo)</h3><label class="trip-label" for="trTitle">Was möchtest du unternehmen?</label><input class="trip-field" id="trTitle" maxlength="90" placeholder="Zum Beispiel: Wer geht mit joggen?"><label class="trip-label" for="trType">Kategorie</label><select class="trip-field" id="trType">${groups.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><label class="trip-label" for="trCity">Ungefähre Gegend</label><input class="trip-field" id="trCity" maxlength="55" placeholder="Zum Beispiel: Wuppertal-Barmen"><label class="trip-label" for="trDate">Wann?</label><input class="trip-field" id="trDate" type="datetime-local"><label class="trip-label" for="trText">Beschreibung (keine genaue Adresse)</label><textarea class="trip-field" id="trText" rows="3" maxlength="500"></textarea><label style="display:flex;gap:10px;align-items:center;margin:12px 0"><input type="checkbox" id="trOpen" checked onchange="document.getElementById('trMaxWrap').style.display=this.checked?'none':'block'"> Ohne feste Teilnehmerbegrenzung</label><div id="trMaxWrap" style="display:none"><label class="trip-label">Freie Plätze</label><input class="trip-field" id="trMax" type="number" min="1" max="50" value="3"></div><div class="trip-row"><button class="trip-btn" onclick="tripCreate()">In der Demo erstellen</button><button class="trip-btn secondary" onclick="tripForm=false;render()">Abbrechen</button></div><p class="trip-note">Nur auf diesem Gerät sichtbar, keine echte Veröffentlichung.</p></div>`:''}<h3 style="margin:24px 0 8px">Aktivitäten entdecken</h3><div style="display:flex;overflow-x:auto;gap:8px;padding-bottom:8px">${['Alle','Meine',...groups.slice(1)].map(c=>`<button class="trip-btn ${c===tripFilter?'':'secondary'}" style="white-space:nowrap" onclick="tripFilter='${c}';render()">${c}</button>`).join('')}</div>${tripData.filter(t=>tripFilter==='Alle'||tripFilter==='Meine'&&t.own||tripFilter===t.type).map(tripCard).join('')||'<p class="muted">Hier sind noch keine Aktivitäten. Erstelle selbst eine!</p>'}<p class="trip-note">Testversion: Keine echten Teilnehmer, Benachrichtigungen oder Standortfreigaben.</p></section>`}
function tripCreate(){const get=id=>document.getElementById(id)?.value.trim()||'';const title=get('trTitle'),city=get('trCity'),description=get('trText'),date=get('trDate'),unlimited=document.getElementById('trOpen').checked;if(!title||!city||!description){alert('Bitte Titel, ungefähre Gegend und Beschreibung ausfüllen.');return}tripData.unshift({id:'t'+Date.now(),title,type:get('trType'),city,description,date,max:unlimited?0:Math.max(1,Math.min(50,Number(get('trMax'))||3)),booked:0,unlimited,own:true,status:'active',request:false,accepted:false,messages:[]});tripSave();tripForm=false;tripFilter='Meine';render();window.scrollTo(0,0)}
function tripOpen(id){tripActive=id;go('tripdetail')}
function tripRequest(){let t=tripFind(tripActive);if(!t)return;t.request=true;tripSave();render()}
function tripAccept(){let t=tripFind(tripActive);if(!t)return;t.accepted=true;if(!t.unlimited)t.booked=Math.min(t.max,t.booked+1);tripSave();render()}
function tripCancel(){let t=tripFind(tripActive);if(!t)return;if(!confirm('Teilnahme in der Demo zurückziehen?'))return;if(t.accepted&&!t.unlimited)t.booked=Math.max(0,t.booked-1);t.request=false;t.accepted=false;tripSave();render()}
function tripPost(){let t=tripFind(tripActive);const input=document.getElementById('trip-message');if(!t||!input||!input.value.trim())return;t.messages.push({mine:true,text:input.value.trim().slice(0,500)});tripSave();render()}
function tripReply(){let t=tripFind(tripActive);if(!t)return;t.messages.push({mine:false,text:'Danke für deine Nachricht! Wir können den Treffpunkt gemeinsam vereinbaren. (Simulation)'});tripSave();render()}
function tripDetailPage(){const t=tripFind(tripActive);if(!t)return tripsPage();const left=Math.max(0,t.max-t.booked);return `<section class="screen"><button class="trip-btn secondary" onclick="goBack()">← Zurück zu den Aktivitäten</button>${tripCard(t)}<div class="trip-card"><h3>${t.own?'Anfragen verwalten':'Teilnahme anfragen'}</h3>${t.own?`<p class="trip-note">Dies ist deine eigene Demo-Aktivität. In einer echten App siehst du hier eingehende Anfragen und entscheidest selbst.</p><button class="trip-btn secondary" onclick="if(confirm('Aktivität aus der lokalen Demo löschen?')){tripData=tripData.filter(x=>x.id!=='${t.id}');tripSave();go('rides')}">Eigene Aktivität löschen</button>`:!t.request?`<p>Du kannst unverbindlich anfragen. Ein Chat öffnet sich erst nach Zustimmung.</p><button class="trip-btn" ${(!t.unlimited&&left===0)?'disabled':''} onclick="tripRequest()">Ich will auch! · Teilnahme anfragen</button>`:`<div class="trip-status">✓ Teilnahme angefragt (Demo)</div>${!t.accepted?`<button class="trip-btn" onclick="tripAccept()">Zusage der Gegenseite simulieren</button>`:`<div class="trip-status">✓ Teilnahme bestätigt (Simulation)</div>`}<div class="trip-row"><button class="trip-btn warn" onclick="tripCancel()">Teilnahme zurückziehen</button></div>`}</div>${t.accepted&&!t.own?`<div class="trip-card"><h3>💬 Privater Demo-Chat</h3><p class="trip-note">Nur nach bestätigter Anfrage. Es werden keine echten Nachrichten versendet.</p><div class="trip-chat">${t.messages.map(m=>`<div class="trip-msg ${m.mine?'mine':''}">${escapeHtml(m.text)}</div>`).join('')||'<p class="trip-note">Noch keine Nachrichten.</p>'}</div><label class="trip-label" for="trip-message">Nachricht</label><textarea id="trip-message" class="trip-field" rows="2" placeholder="Was möchtest du fragen?"></textarea><div class="trip-row"><button class="trip-btn" onclick="tripPost()">Nachricht hinzufügen</button><button class="trip-btn secondary" onclick="tripReply()">Antwort simulieren</button></div><h3>📍 Treffpunkt & Google Maps</h3><p class="trip-note">Vor einer ausdrücklichen Freigabe ist nur die ungefähre Gegend bekannt. Keine automatische Übernahme von Wohnadressen.</p><button class="trip-btn secondary" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('${escapeHtml(t.city)}'),'_blank','noopener')">Gegend auf Google Maps ansehen</button></div>`:`<div class="trip-card"><h3>📍 Gegend ansehen</h3><p class="trip-note">Öffnet lediglich die ungefähre Region – keine Privatadresse.</p><button class="trip-btn secondary" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('${escapeHtml(t.city)}'),'_blank','noopener')">Gegend auf Google Maps ansehen</button></div>`}<button class="trip-btn secondary" onclick="goBack()">← Zurück zu den Aktivitäten</button></section>`}
const v23OldRender=render;
render=function(){if(state.page==='rides'||state.page==='tripdetail'){el.innerHTML=header()+(state.page==='rides'?tripsPage():tripDetailPage())+'<div class="demo">DEMO · Aktivitäten und Chats nur auf diesem Gerät</div>'+nav();const h=el.querySelector('header');if(h){let b=document.createElement('div');b.className='smart-back-wrap';b.innerHTML='<button type="button" class="smart-back" onclick="goBack()">← Zurück</button>';h.insertAdjacentElement('afterend',b)}return}v23OldRender()};
</script>

<script>
// Tierfreunde V24 – ausschließlich lokale Beispieldaten; keine echte Tiervermittlung.
const PET_STORE='iwa_v24_pets';
const petExamples=[
{id:'luna',type:'suche',title:'Betreuung für Katze Luna gesucht',city:'Wuppertal-Barmen',animal:'Katze',desc:'Für drei Tage suche ich eine zuverlässige Betreuung. Futter und Pflegehinweise stelle ich bereit.',date:'Nach Absprache'},
{id:'hunde',type:'biete',title:'Ich gehe gern mit Hunden spazieren',city:'Remscheid',animal:'Hund',desc:'Ich habe Erfahrung und biete nach vorherigem Kennenlernen gelegentlich Unterstützung an.',date:'Wochenende'},
{id:'runde',type:'treffen',title:'Gemeinsame Hunderunde im Grünen',city:'Solingen',animal:'Hund',desc:'Wer möchte mit seinem Hund eine entspannte Runde laufen? Erstes Treffen an öffentlichem Ort.',date:'Sonntag'},
{id:'heim',type:'zuhause',title:'Zuhause für erwachsene Katze gesucht',city:'Wuppertal',animal:'Katze',desc:'Fiktives Beispiel einer verantwortungsvollen Weitervermittlung. Kein Sofortverkauf, persönliche Prüfung und Beratung erforderlich.',date:'Nach sorgfältiger Prüfung'}
];
let petData;try{const x=JSON.parse(localStorage.getItem(PET_STORE));petData=x&&Array.isArray(x.ads)?x:{ads:petExamples.map(e=>({...e,status:'aktiv',mine:false,requested:false,accepted:false,messages:[]}))}}catch(e){petData={ads:petExamples.map(e=>({...e,status:'aktiv',mine:false,requested:false,accepted:false,messages:[]}))}}
let petTab='alle',petForm=false,petCurrent='luna';
function petSave(){try{localStorage.setItem(PET_STORE,JSON.stringify(petData))}catch(e){}}
function petGet(id){return petData.ads.find(a=>a.id===id)}
function petMap(city){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(city+', Deutschland'),'_blank','noopener,noreferrer')}
function petList(){const tabs=[['alle','Alle'],['suche','Betreuung suchen'],['biete','Betreuung anbieten'],['treffen','Gemeinsam unterwegs'],['zuhause','Neues Zuhause']];return `<section class="screen"><div class="pet-hero"><h2>🐾 Tierfreunde</h2><div>Gemeinsam Verantwortung übernehmen. Betreuung, Spaziergänge und verantwortungsvolle Vermittlung.</div></div><div class="pet-tabs">${tabs.map(([id,t])=>`<button class="pet-tab ${petTab===id?'on':''}" onclick="petTab='${id}';render()">${t}</button>`).join('')}</div><button class="pet-btn" onclick="petForm=true;render()">＋ Beitrag erstellen</button><button class="pet-btn light" onclick="petTab='meine';render()">Meine Beiträge</button>${petForm?petFormView():''}${petTab==='zuhause'?`<div class="pet-warning"><b>Ein Tier ist kein Gegenstand.</b><br>Keine Sofortkäufe, keine anonyme Abgabe, kein Versand von Tieren. Eine spätere öffentliche Vermittlung braucht eine Prüfung der Anbieter, die Beachtung der Tierschutzvorgaben und gegebenenfalls Zusammenarbeit mit Tierheimen. Diese Demo vermittelt keine Tiere.</div>`:''}<div class="pet-muted">Beispielbeiträge aus der Region · Personen bleiben zunächst anonym · keine öffentlichen Privatadressen.</div>${petData.ads.filter(a=>petTab==='alle'||(petTab==='meine'?a.mine:a.type===petTab)).map(a=>`<div class="pet-card"><span class="pet-tag">${{suche:'Betreuung gesucht',biete:'Betreuung angeboten',treffen:'Gemeinsame Aktivität',zuhause:'Neues Zuhause gesucht'}[a.type]}</span><span class="pet-tag">${escapeHtml(a.animal)}</span><h3>${escapeHtml(a.title)}</h3><div class="pet-muted">📍 ${escapeHtml(a.city)} · ${a.mine?'Mein Beitrag':'Anonymes Testmitglied'} · ${escapeHtml(a.date||'Nach Absprache')}</div><p>${escapeHtml(a.desc)}</p><div class="pet-muted">Status: ${escapeHtml(a.status||'aktiv')}</div><button class="pet-btn" onclick="petCurrent='${a.id}';go('petdetail')">${a.mine?'Beitrag verwalten':'Beitrag ansehen'}</button></div>`).join('')||'<div class="pet-card">Hier sind derzeit keine Beiträge vorhanden.</div>'}<p class="pet-muted">DEMO: Keine echten Konten, Tiervermittlung, Zahlungen oder Kontaktübertragung.</p></section>`}
function petFormView(){return `<div class="pet-card"><h3>Neuen Tierfreunde-Beitrag erstellen</h3><label>Was möchtest du machen?</label><select id="petType" class="pet-input"><option value="suche">Tierbetreuung suchen</option><option value="biete">Tierbetreuung anbieten</option><option value="treffen">Gemeinsamen Spaziergang planen</option><option value="zuhause">Neues Zuhause suchen (nur Demo)</option></select><label>Tierart</label><input id="petAnimal" class="pet-input" placeholder="z. B. Hund oder Katze"><label>Überschrift</label><input id="petTitle" class="pet-input" maxlength="100" placeholder="Worum geht es?"><label>Ungefähre Gegend</label><input id="petCity" class="pet-input" placeholder="z. B. Wuppertal-Barmen"><label>Beschreibung</label><textarea id="petDesc" class="pet-input" rows="4" maxlength="650" placeholder="Erkläre dein Anliegen – keine Namen, Telefonnummern oder Adressen."></textarea><button class="pet-btn" onclick="petCreate()">In der Demo freigeben</button><button class="pet-btn light" onclick="petForm=false;render()">Abbrechen</button><p class="pet-muted">Nur lokal auf diesem Gerät sichtbar. Kein Upload an echte Mitglieder.</p></div>`}
function petCreate(){const v=id=>document.getElementById(id)?.value.trim()||'';if(!v('petTitle')||!v('petCity')||!v('petDesc')||!v('petAnimal')){alert('Bitte alle Felder ausfüllen.');return}const type=v('petType');if(type==='zuhause'&&!confirm('Dieser Beitrag ist nur eine Demo. Keine echte Tiervermittlung oder öffentliche Veröffentlichung. Fortfahren?'))return;const id='p'+Date.now();petData.ads.unshift({id,type,title:v('petTitle').slice(0,100),city:v('petCity').slice(0,90),animal:v('petAnimal').slice(0,60),desc:v('petDesc').slice(0,650),date:'Neu',status:'aktiv',mine:true,requested:false,accepted:false,messages:[]});petSave();petForm=false;petTab='meine';render();window.scrollTo(0,0)}
function petDetail(){const a=petGet(petCurrent);if(!a)return petList();return `<section class="screen"><button class="pet-btn light" onclick="goBack()">← Zurück zu Tierfreunde</button><div class="pet-card"><span class="pet-tag">${escapeHtml(a.animal)}</span><h2>${escapeHtml(a.title)}</h2><div class="pet-muted">📍 ${escapeHtml(a.city)} · ${a.mine?'Mein Testbeitrag':'Anonymes Mitglied'}</div><p>${escapeHtml(a.desc)}</p><button class="pet-btn light" onclick="petMap('${escapeHtml(a.city).replace(/'/g,'&#39;')}')">📍 Gegend auf Google Maps ansehen</button>${a.type==='zuhause'?`<div class="pet-warning">Bei einer Tiervermittlung sind persönliches Kennenlernen, Prüfung der Umstände sowie tierschutzrechtliche Vorgaben besonders wichtig. Keine automatische Übergabe, kein Kauf- oder Zahlungsbutton. Interessensbekundungen sind nur simuliert.</div>`:''}${a.mine?`<div class="pet-row"><button class="pet-btn light" onclick="petChangeStatus()">${a.status==='aktiv'?'Als erledigt markieren':'Wieder öffnen'}</button><button class="pet-btn red" onclick="petDelete()">Beitrag löschen</button></div>`:`<button class="pet-btn" onclick="petRequest()">${a.requested?'✓ Interesse vorgemerkt':a.type==='zuhause'?'Interesse vormerken (Demo)':'Kontakt anfragen'}</button>${a.requested&&!a.accepted?`<button class="pet-btn light" onclick="petAccept()">Zustimmung simulieren</button>`:''}${a.accepted?`<div class="pet-warning">✓ Gegenseitige Zustimmung simuliert. Jetzt kann ein privater Demo-Chat geöffnet werden.</div><button class="pet-btn" onclick="go('petchat')">Privaten Demo-Chat öffnen</button>`:''}`}</div><button class="pet-btn light" onclick="goBack()">← Zurück</button></section>`}
function petRequest(){const a=petGet(petCurrent);a.requested=true;petSave();render()}
function petAccept(){const a=petGet(petCurrent);a.accepted=true;petSave();render()}
function petChangeStatus(){const a=petGet(petCurrent);a.status=a.status==='aktiv'?'erledigt':'aktiv';petSave();render()}
function petDelete(){if(!confirm('Eigenen Testbeitrag wirklich löschen?'))return;petData.ads=petData.ads.filter(a=>a.id!==petCurrent);petSave();state.page='pets';petTab='meine';render()}
function petSend(){const a=petGet(petCurrent),e=document.getElementById('petMessage');if(!a||!a.accepted||!e||!e.value.trim())return;a.messages.push({mine:true,text:e.value.trim().slice(0,400)});petSave();render()}
function petReply(){const a=petGet(petCurrent);if(!a||!a.accepted)return;a.messages.push({mine:false,text:'Vielen Dank für deine Nachricht! Lass uns die Einzelheiten in Ruhe besprechen. (Demo-Antwort)'});petSave();render()}
function petChat(){const a=petGet(petCurrent);if(!a||!a.accepted)return petDetail();return `<section class="screen"><button class="pet-btn light" onclick="goBack()">← Zurück zum Tierfreunde-Beitrag</button><div class="pet-card"><h2>🔒 Privater Demo-Chat</h2><div class="pet-muted">${escapeHtml(a.title)} · nur simuliert</div>${(a.messages||[]).map(m=>`<div class="pet-bubble ${m.mine?'mine':''}">${escapeHtml(m.text)}</div>`).join('')||'<p class="pet-muted">Hier kannst du eine Testnachricht schreiben.</p>'}<textarea id="petMessage" class="pet-input" rows="3" placeholder="Nachricht schreiben …"></textarea><button class="pet-btn" onclick="petSend()">Nachricht hinzufügen</button><button class="pet-btn light" onclick="petReply()">Antwort simulieren</button><div class="pet-warning">Google Maps zeigt hier nur die ungefähre Gegend. Eine genaue Privatadresse wird nicht automatisch weitergegeben.</div><button class="pet-btn light" onclick="petMap('${escapeHtml(a.city).replace(/'/g,'&#39;')}')">📍 Gegend auf Google Maps ansehen</button><button class="pet-btn light" onclick="goBack()">← Zurück zum Beitrag</button></div></section>`}
const v24PriorRender=render;
render=function(){if(['pets','petdetail','petchat'].includes(state.page)){el.innerHTML=header()+(state.page==='pets'?petList():state.page==='petdetail'?petDetail():petChat())+'<div class="demo">DEMO · Alle Beiträge und Nachrichten nur auf diesem Gerät</div>'+nav();if(state.page!=='pets'){let h=el.querySelector('header');if(h){let b=document.createElement('div');b.className='smart-back-wrap';b.innerHTML='<button class="smart-back" onclick="goBack()">← Zurück</button>';h.insertAdjacentElement('afterend',b)}}}else v24PriorRender()};
</script>

<script>
// V27 Arbeitswelt: bewusst nur lokale Testdaten; keine Bewerbung, Nachrichten oder Identitaetspruefung auf einem Server.
const workInitial=[
{id:'j1',type:'job',title:'Küchenhilfe in Teilzeit (m/w/d)',company:'Pizzeria bei Giovanni',city:'Wuppertal-Barmen',kind:'Teilzeit',desc:'Mitarbeit in unserer Küche. 3–4 feste Arbeitstage pro Woche, Mittwoch bis Sonntag im Zeitraum 17–21 Uhr. Gastronomische Erfahrung, Führerschein Klasse B und eigenes Fahrzeug werden für diese Beispielanzeige vorausgesetzt.',requirements:'Gastronomieerfahrung, Führerschein B, eigenes Auto',mine:false},

{id:'j3',type:'training',title:'Ausbildung im Einzelhandel (m/w/d)',company:'Beispielmarkt Solingen',city:'Solingen',kind:'Ausbildung',desc:'Fiktiver Ausbildungsplatz für Menschen, die gern mit Kunden arbeiten und den Handel kennenlernen möchten.',requirements:'Interesse am Einzelhandel und Teamarbeit',mine:false}
];
function workLoad(){try{let x=JSON.parse(localStorage.getItem('iwa_work_v27'));if(x&&Array.isArray(x.ads))return x}catch(e){}return {ads:[],interest:[],draft:{}}}
let workState=workLoad(),workTab='alle',workCurrent='j1';
function workSave(){try{localStorage.setItem('iwa_work_v27',JSON.stringify(workState))}catch(e){}}
function workAll(){return [...workState.ads,...workInitial]}
function workItem(id){return workAll().find(a=>a.id===id)}

function workMain(){let rows=workAll().filter(a=>workTab==='alle'||(workTab==='meine'?a.mine:a.type===workTab));return `<section class="screen"><button class="work-btn light" onclick="go('modules')">← Alle Bausteine</button><div class="work-hero"><span class="work-tag">💼 Arbeitswelt</span><h2>Hier beginnt deine nächste Chance</h2><p class="work-muted">Stellenangebote und Ausbildungsplätze aus deiner Nähe. Unternehmen und Arbeitssuchende kommen unkompliziert in Kontakt.</p><div class="work-actions"><button class="work-btn" onclick="go('workcreate')">+ Stellenanzeige erstellen</button><button class="work-btn orange" onclick="workSetTab('alle')">Angebote entdecken</button></div></div><div class="work-warning"><b>Nur Demo:</b> Alle Unternehmen und Anzeigen sind Beispielinhalte, einschließlich der Pizzeria-Anzeige. Keine echten Bewerbungen, Kosten, Zahlungen oder Datenübertragungen.</div><div class="work-actions">${[['alle','Alle'],['job','Jobs'],['training','Ausbildung'],['meine','Meine Anzeigen']].map(x=>`<button class="work-btn ${workTab===x[0]?'':'light'}" onclick="workSetTab('${x[0]}')">${x[1]}</button>`).join('')}</div><h2 style="margin:15px 0">${workTab==='meine'?'Meine Testanzeigen':'Angebote in deiner Nähe'}</h2>${rows.length?rows.map(a=>`<article class="work-card"><span class="work-tag">${a.type==='training'?'🎓 Ausbildung':'💼 '+workEsc(a.kind)}</span><h3>${workEsc(a.title)}</h3><div class="work-muted">${workEsc(a.company)} · 📍 ${workEsc(a.city)}</div><p>${workEsc(a.desc)}</p><button class="work-btn" onclick="workOpen('${a.id}')">Anzeige ansehen →</button></article>`).join(''):'<p class="work-empty">Hier gibt es noch keine eigenen Anzeigen.</p>'}<div class="work-card"><h3>Für Unternehmen</h3><p class="work-muted">Zunächst als freiwilliger Pilot ohne echte Gebühren. Später könnten überprüfte Firmen Stellenanzeigen einstellen. Konditionen sind noch nicht festgelegt.</p><button class="work-btn light" onclick="go('workcreate')">Demo-Anzeige erstellen</button></div></section>`}
function workDetail(){let a=workItem(workCurrent);if(!a)return workMain();let interested=workState.interest.includes(a.id);return `<section class="screen"><button class="work-btn light" onclick="workBack()">← Zurück zur Arbeitswelt</button><article class="work-card"><span class="work-tag">${a.type==='training'?'🎓 Ausbildungsplatz':'💼 '+workEsc(a.kind)}</span><h2>${workEsc(a.title)}</h2><h3>${workEsc(a.company)}</h3><p class="work-muted">📍 ${workEsc(a.city)}</p><p>${workEsc(a.desc)}</p><h3>Das solltest du mitbringen</h3><p>${workEsc(a.requirements)}</p><button class="work-btn light" onclick="GenUI_workMap()">📍 Gegend auf Google Maps ansehen</button><div class="work-warning"><b>Datenschutz:</b> Interessenanfragen sind hier nur simuliert. Es werden keine Lebensläufe, Telefonnummern oder Bewerbungsdaten versendet.</div>${a.mine?`<div class="work-actions"><button class="work-btn light" onclick="workEdit('${a.id}')">Anzeige bearbeiten</button><button class="work-btn red" onclick="workDelete('${a.id}')">Anzeige löschen</button></div>`:`<div class="work-actions"><button class="work-btn" onclick="workInterest('${a.id}')">${interested?'✓ Interesse vorgemerkt':'Interesse anmelden (Demo)'}</button></div>${interested?'<p class="work-muted">Dein Interesse ist ausschließlich auf diesem Gerät vorgemerkt. Das Unternehmen wird nicht benachrichtigt.</p>':''}`}</article><button class="work-btn light" onclick="workBack()">← Zurück zu allen Angeboten</button></section>`}

nd nicht Teil dieser Demo.</div></div></section>`}
function workSubmit(id){let val=k=>document.getElementById(k).value.trim();let company=val('workCompany'),title=val('workTitle'),city=val('workCity'),desc=val('workDesc');if(!company||!title||!city||!desc){alert('Bitte Unternehmen, Titel, Gegend und Beschreibung ausfüllen.');return}let a={id:id||'work'+Date.now(),mine:true,type:val('workType'),company,title,city,kind:val('workKind'),desc,requirements:val('workReq')||'Nach Absprache'};let i=workState.ads.findIndex(x=>x.id===a.id);if(i>=0)workState.ads[i]=a;else workState.ads.unshift(a);workSave();workCurrent=a.id;go('workdetail')}

<script>
// V28: rein lokale, ausdrücklich simulierte Bewerbungsfreigaben.
let workProcess={};try{workProcess=JSON.parse(localStorage.getItem('iwa_work_process_v28')||'{}')||{}}catch(e){}
function workProcessSave(){try{localStorage.setItem('iwa_work_process_v28',JSON.stringify(workProcess))}catch(e){}}
function workProc(id){if(!workProcess[id])workProcess[id]={status:'none',note:'',messages:[]};return workProcess[id]}
function workApply(id){let a=workItem(id),p=workProc(id),node=document.getElementById('workApplicantNote');if(!a||!node)return;let note=node.value.trim();if(note.length<15){alert('Schreibe bitte mindestens einen kurzen Satz zu deinem Interesse.');return}p.note=note.slice(0,450);p.status='pending';workProcessSave();render()}
function workEmployerDecision(id,yes){let p=workProc(id);if(p.status!=='pending')return;p.status=yes?'accepted':'declined';workProcessSave();render()}
function workWithdraw(id){let p=workProc(id);if(!confirm('Interessenanfrage in dieser Demo zurückziehen?'))return;p.status='withdrawn';workProcessSave();render()}
function workOpenChat(id){let p=workProc(id);if(p.status!=='accepted')return;workCurrent=id;state.page='workchat';render();window.scrollTo(0,0)}
function workSendChat(){let p=workProc(workCurrent),node=document.getElementById('workChatText');if(p.status!=='accepted'||!node||!node.value.trim())return;p.messages.push({mine:true,text:node.value.trim().slice(0,350)});workProcessSave();render()}
function workSimulateReply(){let p=workProc(workCurrent);if(p.status!=='accepted')return;p.messages.push({mine:false,text:'Vielen Dank für deine Nachricht. Wir können die nächsten Schritte hier besprechen. (Simulierte Antwort des Unternehmens)'});workProcessSave();render()}
function workChatPage(){let a=workItem(workCurrent),p=workProc(workCurrent);if(!a||p.status!=='accepted')return workMain();return `<section class="screen"><button class="work-btn light" onclick="workOpen('${a.id}')">← Zurück zur Stellenanzeige</button><article class="work-card"><h2>🔒 Privater Bewerbungs-Chat</h2><p class="work-muted">${workEsc(a.title)} · ${workEsc(a.company)}</p><div class="work-warning">Nur Demo auf diesem Gerät. Keine echte Firma erhält deine Nachrichten oder persönlichen Daten. Teile hier keine vertraulichen Unterlagen.</div>${p.messages.length?p.messages.map(m=>`<div class="work-message ${m.mine?'me':''}">${workEsc(m.text)}</div>`).join(''):'<div class="work-choice">Du kannst dem Unternehmen eine Testnachricht schreiben.</div>'}<label for="workChatText"><b>Deine Nachricht</b></label><textarea id="workChatText" class="work-field" rows="3" maxlength="350" placeholder="Wann wäre ein Kennenlerngespräch möglich?"></textarea><div class="work-actions"><button class="work-btn" onclick="workSendChat()">Nachricht hinzufügen</button><button class="work-btn light" onclick="workSimulateReply()">Firmenantwort simulieren</button></div><button class="work-btn light" onclick="workOpen('${a.id}')">← Zurück zur Stellenanzeige</button></article></section>`}
// Hier wird eine Interessensbekundung erst nach einer simulierten Firmenentscheidung zum Chat.
workDetail=function(){let a=workItem(workCurrent);if(!a)return workMain();let proc=workProc(a.id);let isMine=!!a.mine;let labels={none:'Noch keine Anfrage',pending:'Anfrage eingegangen · Entscheidung offen',accepted:'Anfrage angenommen (Demo)',declined:'Anfrage abgelehnt (Demo)',withdrawn:'Anfrage zurückgezogen'};let applicant=`<div class="work-card"><h3>🤝 Interesse an dieser Stelle</h3><p class="work-muted">Du kannst dich unverbindlich vorstellen. Dein voller Name, deine Telefonnummer oder Bewerbungsunterlagen werden nicht übermittelt.</p>${proc.status==='none'||proc.status==='withdrawn'||proc.status==='declined'?`<label for="workApplicantNote"><b>Kurze Vorstellung</b></label><textarea id="workApplicantNote" class="work-field" rows="3" maxlength="450" placeholder="Ich habe Erfahrung in … und interessiere mich für diese Tätigkeit."></textarea><button class="work-btn" onclick="workApply('${a.id}')">Interesse anmelden (Demo)</button>`:`<div class="work-status">${labels[proc.status]}</div><p><b>Deine Vorstellung:</b> ${workEsc(proc.note)}</p>${proc.status==='pending'?`<div class="work-choice"><b>Unternehmensentscheidung zum Testen</b><p class="work-muted">In der echten App kann nur das zuständige Unternehmen entscheiden. Hier simulierst du dessen Antwort.</p><div class="work-actions"><button class="work-btn" onclick="workEmployerDecision('${a.id}',true)">Unternehmen nimmt an (Demo)</button><button class="work-btn light" onclick="workEmployerDecision('${a.id}',false)">Unternehmen lehnt ab (Demo)</button></div><button class="work-btn red" onclick="workWithdraw('${a.id}')">Anfrage zurückziehen</button></div>`:''}${proc.status==='accepted'?`<p class="work-muted">Erst jetzt ist der private Demo-Chat verfügbar.</p><button class="work-btn" onclick="workOpenChat('${a.id}')">Privaten Demo-Chat öffnen</button>`:''}`}</div>`;
return `<section class="screen"><button class="work-btn light" onclick="workBack()">← Zurück zur Arbeitswelt</button><article class="work-card"><span class="work-tag">${a.type==='training'?'🎓 Ausbildungsplatz':'💼 '+workEsc(a.kind)}</span><h2>${workEsc(a.title)}</h2><h3>${workEsc(a.company)}</h3><p class="work-muted">📍 ${workEsc(a.city)}</p><p>${workEsc(a.desc)}</p><h3>Das solltest du mitbringen</h3><p>${workEsc(a.requirements)}</p><button class="work-btn light" onclick="GenUI_workMap()">📍 Gegend auf Google Maps ansehen</button></article>${isMine?`<div class="work-card"><h3>Meine Firmenanzeige</h3><p class="work-muted">Hier lassen sich in Zukunft Anfragen ausschließlich im geprüften Unternehmenskonto bearbeiten. In dieser Demo kannst du den Ablauf anhand der Beispielstellen ausprobieren.</p><div class="work-actions"><button class="work-btn light" onclick="workEdit('${a.id}')">Anzeige bearbeiten</button><button class="work-btn red" onclick="workDelete('${a.id}')">Anzeige löschen</button></div></div>`:applicant}<div class="work-warning"><b>Datenschutz:</b> Alle Anfragen, Entscheidungen und Chats sind ausschließlich simuliert und lokal gespeichert. Firmenprüfung und echter Datenaustausch sind noch nicht umgesetzt.</div><button class="work-btn light" onclick="workBack()">← Zurück zu allen Angeboten</button></section>`};
const v28PreviousRender=render;
render=function(){if(state.page==='workchat'){el.innerHTML=header()+workChatPage()+'<div class="demo">DEMO · Keine echten Bewerbungen oder Nachrichten</div>'+nav()}else v28PreviousRender()};
</script>

<script>
// V29: rein lokale Demo. Kein Geo-Tracking, keine Netzwerkkommunikation, keine echten Besucher.
const hereVenues=[
 {id:'cafe',icon:'☕',name:'Café-Treff',area:'Wuppertal-Barmen',type:'Café / Kaffeetrinken',sample:'Wer hat Lust auf einen Kaffee und ein nettes Gespräch?'},
 {id:'park',icon:'🌳',name:'Stadtpark',area:'Remscheid',type:'Spaziergang',sample:'Ich gehe eine Runde spazieren. Mag jemand mitkommen?'},
 {id:'markt',icon:'🎪',name:'Stadtfest',area:'Solingen',type:'Veranstaltung',sample:'Ich bin beim Stadtfest. Wer möchte gemeinsam eine Runde drehen?'},
 {id:'kultur',icon:'🎭',name:'Kulturtreff',area:'Wuppertal-Elberfeld',type:'Kultur / Veranstaltung',sample:'Wer hat Lust auf einen netten Austausch vor der Veranstaltung?'}
];
let hereData={venue:null,until:0,intro:'',requests:{},blocked:[],messages:{}};
try{const saved=JSON.parse(localStorage.getItem('iwa_here_v29')||'null');if(saved&&typeof saved==='object')hereData={...hereData,...saved}}catch(e){}
let hereSelected='cafe',hereOther='';
function hereSave(){try{localStorage.setItem('iwa_here_v29',JSON.stringify(hereData))}catch(e){}}
function hereActive(){return !!hereData.venue&&hereData.until>Date.now()}
function hereVenue(id){return hereVenues.find(v=>v.id===id)||hereVenues[0]}
function hereGo(id){hereSelected=id;hereOther='';go('hereplace')}
function hereStart(){const intro=document.getElementById('hereIntro');const accepted=document.getElementById('hereConsent');if(!accepted?.checked){alert('Bitte bestätige zuerst die freiwillige Sichtbarkeit.');return}hereData.venue=hereSelected;hereData.until=Date.now()+60*60*1000;hereData.intro=(intro?.value||'').trim().slice(0,170);hereSave();render()}
function hereLeave(){hereData.venue=null;hereData.until=0;hereData.requests={};hereSave();render()}
function hereAsk(id){hereData.requests[id]='pending';hereSave();render()}
function hereDecision(id,accepted){hereData.requests[id]=accepted?'accepted':'declined';hereSave();render()}
function hereBlock(id){if(!confirm('Testmitglied blockieren? Die Anfrage und der Chat werden verborgen.'))return;hereData.blocked=[...new Set([...hereData.blocked,id])];delete hereData.requests[id];hereSave();render()}
function hereSend(id){let node=document.getElementById('hereText'),txt=node?.value?.trim();if(!txt)return;if(!hereData.messages[id])hereData.messages[id]=[];hereData.messages[id].push({mine:true,text:txt.slice(0,350)});hereSave();render()}

function herePlace(){const v=hereVenue(hereSelected),active=hereActive(),own=active&&hereData.venue===v.id,id='test-'+v.id,status=hereData.requests[id]||'none',blocked=hereData.blocked.includes(id);return `<section class="screen"><button class="back" onclick="go('here')">← Zurück zu allen Orten</button><div class="here-hero"><div class="here-kicker">${v.icon} ${escapeHtml(v.type)}</div><h2>${escapeHtml(v.name)}</h2><p>📍 ${escapeHtml(v.area)} · öffentlicher Treffpunkt</p></div><div class="here-actions"><button class="here-softbtn" onclick="hereMap()">🗺️ Gegend auf Google Maps</button><button class="here-softbtn" onclick="go('here')">← Orte ansehen</button></div>${own?`<div class="here-card"><h3>🟢 Du bist hier eingecheckt</h3><p>${escapeHtml(hereData.intro||'Ich freue mich über nette Begegnungen!')}</p><div class="here-ok">Sichtbarkeit endet automatisch nach spätestens einer Stunde. Keine echten Nutzer können dich sehen.</div><button class="here-softbtn" onclick="hereLeave()">Check-in sofort beenden</button></div>`:`<div class="here-card"><h3>Ich bin auch hier!</h3><p class="muted">Nur wenn du möchtest: Aktiviere eine einstündige Demo-Sichtbarkeit für diesen öffentlichen Ort.</p><label class="here-label" for="hereIntro">Deine kurze Nachricht (optional)</label><textarea class="here-field" id="hereIntro" rows="2" maxlength="170" placeholder="Ich hätte Lust auf einen Kaffee und ein nettes Gespräch."></textarea><label style="display:flex;gap:10px;align-items:flex-start;line-height:1.45"><input type="checkbox" id="hereConsent" style="width:23px;height:23px;flex-shrink:0;margin-top:2px"> <span>Ich möchte an diesem Ort für eine Stunde freiwillig sichtbar sein (nur Demo).</span></label><button class="here-mainbtn" style="margin-top:14px" onclick="hereStart()">📍 Freiwillig einchecken</button></div>`}<h3 style="margin-top:25px">Begegnungen an diesem Ort</h3><div class="here-card"><div class="here-row"><h3>👤 Mitglied aus ${escapeHtml(v.area)}</h3><span class="here-pill">Fiktives function memberWelcome(){return `<section class="screen"><div class="reg-hero"><div style="font-size:45px">🎉</div><h2>Schön, dass du dabei bist!</h2><p>Dein kostenloses Testprofil ist angelegt.</p></div><div class="reg-box"><b>Deine digitale Demo-Mitgliedskarte</b><p>Ich will auch! · Demo-Nr. 000123</p><p class="muted">Die Nummer ist eine Beispielnummer und keine echte, eindeutige Mitgliedsnummer.</p><h3>Willkommenspaket – ganz freiwillig</h3><p>Zwei Aufkleber, die „Ich bin auch dabei! / Ciao!“-Handkelle und eine Willkommenskarte.</p><p class="muted">Keine Kaufpflicht. Preis und echte Bestellung folgen später.</p><button class="btn" style="width:100%" onclick="memberV30.packageChoice='shop';memberSave();go('welcomeShop30')">Paket im Shop ansehen</button><button class="btn alt" style="width:100%;margin-top:10px" onclick="memberV30.packageChoice='later';memberSave();go('memberProfile30')">Nein danke, zu meinem Profil</button></div></section>`}
function welcomeShop(){return `<section class="screen"><button class="back" onclick="go('welcome30')">← Zurück</button><div class="reg-hero"><h2>🎁 Dein Willkommenspaket</h2><p>Freiwillig und später jederzeit bestellbar.</p></div><div class="reg-box"><p><b>Enthalten:</b> 2 Autoaufkleber, Handkelle „Ich bin auch dabei!“ / „Ciao!“, Willkommenskarte.</p><label class="setting">Meine Mitgliedsnummer später aufdrucken lassen <input type="checkbox" id="packageNumber"></label><div class="notice">Nur Vorschau. Keine echte Bestellung, keine Zahlung und keine Lieferadresse.</div><button class="btn" onclick="go('memberProfile30')">Weiter zu meinem Profil</button><button class="btn alt" style="margin-left:5px" onclick="go('shop')">Zum Demo-Shop</button></div></section>`}
function memberProfile(){let name=escapeHtml(memberV30.name||'Testmitglied'),city=escapeHtml(memberV30.city||'Keine Region angegeben');return `<section class="screen"><button class="back" onclick="go('profile')">← Zurück</button><div class="reg-hero"><h2>Mein persönlicher Bereich</h2><p>Hier bestimmst du selbst, was andere später von dir sehen dürfen.</p></div><div class="reg-box"><div style="display:flex;align-items:center;gap:14px"><div>${memberAvatar()}</div><div><b style="font-size:21px">${name}</b><div class="muted">${city}</div><div class="muted">Demo-Mitglied · 000123</div></div></div><div class="notice">Keine echte Identitätsprüfung. Profil und Fotos sind nur auf diesem Gerät gespeichert.</div><label class="reg-label">Über mich</label><textarea id="memberIntro" class="field" rows="4" maxlength="600" placeholder="Was machst du gern? Was möchtest du erleben?">${escapeHtml(memberV30.intro)}</textarea><label class="reg-label">Meine Interessen</label><div class="choices">${['Spazieren','Kochen','Sport','Tanzen','Tiere','Helfen','Reisen','Kultur','Schwimmen','Kino','Garten','Wandern'].map(t=>`<label><input type="checkbox" data-mtag="${t}" ${memberV30.tags.includes(t)?'checked':''}> ${t}</label>`).join('')}</div><label class="reg-label">Meine Profilfotos (höchstens zwei)</label><div style="display:flex;gap:10px;margin:10px 0">${memberV30.photos.map((ph,i)=>`<div><img src="${ph}" alt="Eigenes Foto ${i+1}" style="width:105px;height:105px;object-fit:cover;border-radius:12px"><button class="btn alt" style="display:block;padding:7px;margin-top:5px" onclick="removeMemberPhoto(${i})">Entfernen</button></div>`).join('')}</div><input type="file" accept="image/png,image/jpeg,image/webp" id="memberPhoto" onchange="memberPhotoUpload(this)" ${memberV30.photos.length>=2?'disabled':''}><p class="muted">JPG, PNG oder WebP. Die Datei wird für diese Geräte-Demo verkleinert. Keine Übertragung ins Internet.</p><h3>Was dürfen andere sehen?</h3>${[['sharePhotos','Meine ausgewählten Fotos'],['shareCity','Meine ungefähre Stadt'],['shareIntro','Meinen Vorstellungstext'],['shareTags','Meine Interessen']].map(([key,label])=>`<label class="setting">${label}<input type="checkbox" data-mvisibility="${key}" ${memberV30[key]?'checked':''}></label>`).join('')}<button class="btn" style="width:100%;margin-top:14px" onclick="memberProfileSave()">Profil speichern</button><button class="btn alt" style="width:100%;margin-top:9px" onclick="memberProfileSave();go('memberPreview30')">Vorschau ansehen</button></div></section>`}
function memberProfileSave(){memberV30.intro=document.getElementById('memberIntro')?.value.trim()||'';memberV30.tags=[...document.querySelectorAll('[data-mtag]:checked')].map(x=>x.dataset.mtag);document.querySelectorAll('[data-mvisibility]').forEach(x=>memberV30[x.dataset.mvisibility]=x.checked);memberSave();}

function memberPhotoUpload(elm){let f=elm.files&&elm.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>8*1024*1024){alert('Bitte JPG, PNG oder WebP bis 8 MB wählen.');return}if(memberV30.photos.length>=2)return;let img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{let scale=Math.min(1,480/img.width,480/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);memberV30.photos.push(canvas.toDataURL('image/jpeg',0.7));memberSave();render()};img.src=reader.result};reader.readAsDataURL(f)}

 ];

</script>
<style>
.v34-panel{background:#fff;border:1px solid #d5e3ef;border-radius:20px;padding:17px;margin:16px 0}.v34-panel h3{margin:5px 0 12px;color:#17385a}.v34-pictures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.v34-pictures img{width:100%;height:105px;object-fit:cover;border-radius:12px}.v34-small{font-size:14px;line-height:1.5;color:#526a7c}.v34-photos-preview{display:flex;gap:8px;margin:10px 0}.v34-photos-preview img{width:68px;height:68px;object-fit:cover;border-radius:10px}.v34-success{padding:12px;background:#e5f7ed;color:#11623d;border-radius:12px;margin:10px 0}.v34-footer{max-width:950px;margin:16px auto;padding:14px;color:#526a7c;font-size:13px}.v34-edit>label{display:block;margin:10px 0 4px;font-weight:bold}.v34-edit input,.v34-edit textarea,.v34-edit select{box-sizing:border-box;width:100%;border:1px solid #b8d0e5;border-radius:12px;font:inherit;padding:11px;background:#fff;color:#183550}.smart-back-wrap{pointer-events:none!important}.smart-back-wrap button{pointer-events:auto} .v34-panel button{margin:5px 5px 5px 0}
</style>
<script>
// V34 remains an offline demonstration. No actual member accounts, uploads or messaging.
const V34_STORE='iwa_v34_features';let v34={photos:{},meetings:{},company:{name:'Pizzeria bei Giovanni',about:'',logo:[]}};
try{const x=JSON.parse(localStorage.getItem(V34_STORE)||'{}');if(x&&typeof x==='object')v34={...v34,...x}}catch(e){}
v34.photos=v34.photos||{};v34.meetings=v34.meetings||{};v34.company=v34.company||{name:'Pizzeria bei Giovanni',about:'',logo:[]};
function v34Save(){try{localStorage.setItem(V34_STORE,JSON.stringify(v34));return true}catch(e){alert('Der lokale Speicher ist voll. Bitte weniger oder kleinere Bilder verwenden.');return false}}
function v34E(x){return escapeHtml(String(x??''))}
function v34Images(key){let arr=v34.photos[key]||[];return arr.length?`<div class="v34-pictures">${arr.map(x=>`<img src="${x}" alt="Bild zum Demobeitrag" loading="lazy">`).join('')}</div>`:''}
async function v34PhotoUpload(key,node){let files=Array.from(node.files||[]);const old=v34.photos[key]||[];if(files.length+old.length>3){alert('Maximal drei Fotos pro Beitrag.');node.value='';return}for(let f of files){if(!f.type.startsWith('image/')){alert('Bitte nur Bilder auswählen.');continue}if(f.size>12e6){alert('Ein Bild ist zu groß (max. 12 MB).');continue}let src=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});let img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=src});let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);old.push(c.toDataURL('image/jpeg',.67))}v34.photos[key]=old;if(!v34Save()){v34.photos[key]=[];v34Save()}render()}
function v34DeletePhotos(key){if(!confirm('Alle Fotos zu diesem Testbeitrag entfernen?'))return;delete v34.photos[key];v34Save();render()}
function v34PhotoPanel(key,owner){return `<div class="v34-panel"><h3>Fotos zum Beitrag (Demo)</h3>${v34Images(key)}${owner?`<p class="v34-small">Bis zu drei Fotos. Die Bilder werden nur lokal auf diesem Gerät gespeichert und nicht veröffentlicht.</p><input aria-label="Fotos hinzufügen" type="file" accept="image/*" multiple onchange="v34PhotoUpload('${key}',this)">${(v34.photos[key]||[]).length?`<button class="trip-btn warn" onclick="v34DeletePhotos('${key}')">Fotos entfernen</button>`:''}`:'<p class="v34-small">Die gezeigten Bilder sind nur lokale Demodaten.</p>'}</div>`}
const v34TripCardOld=tripCard;tripCard=function(t){let s=v34TripCardOld(t);const photos=v34Images('trip-'+t.id);return photos?s.replace('</h3>', '</h3>'+photos):s};
let v34EditOpen=false;
function v34EditActivity(){let t=tripFind(tripActive);if(!t||!t.own)return;v34EditOpen=true;render()}
function v34SaveActivity(){let t=tripFind(tripActive);if(!t||!t.own)return;let val=id=>document.getElementById(id)?.value.trim()||'';if(!val('v34Title')||!val('v34City')||!val('v34Desc'))return alert('Bitte Titel, Gegend und Beschreibung ausfüllen.');Object.assign(t,{title:val('v34Title').slice(0,90),city:val('v34City').slice(0,55),description:val('v34Desc').slice(0,500),date:val('v34Date'),unlimited:document.getElementById('v34Open').checked});if(!t.unlimited)t.max=Math.max(t.booked+1,Math.min(50,Number(val('v34Max'))||3));tripSave();v34EditOpen=false;render()}
function v34EditForm(t){return `<div class="v34-panel v34-edit"><h3>Eigene Aktivität bearbeiten</h3><label>Titel</label><input id="v34Title" maxlength="90" value="${v34E(t.title).replaceAll('"','&quot;')}"><label>Ungefähre Gegend</label><input id="v34City" maxlength="55" value="${v34E(t.city).replaceAll('"','&quot;')}"><label>Datum und Uhrzeit</label><input id="v34Date" type="datetime-local" value="${v34E(t.date)}"><label>Beschreibung (keine Privatadresse)</label><textarea id="v34Desc" rows="3" maxlength="500">${v34E(t.description)}</textarea><label><input type="checkbox" style="width:auto" id="v34Open" ${t.unlimited?'checked':''}> Ohne Teilnehmerbegrenzung</label><label>Maximale Plätze (wenn begrenzt)</label><input type="number" id="v34Max" min="1" max="50" value="${t.max||3}"><button class="trip-btn" onclick="v34SaveActivity()">Änderungen speichern</button><button class="trip-btn secondary" onclick="v34EditOpen=false;render()">Abbrechen</button></div>`}
function v34ToggleActivity(){let t=tripFind(tripActive);if(!t||!t.own)return;t.status=t.status==='cancelled'?'active':'cancelled';tripSave();render()}
function v34Meeting(){return v34.meetings[tripActive]||(v34.meetings[tripActive]={place:'',mine:false,other:false})}
function v34ProposeMeeting(){let t=tripFind(tripActive);if(!t||!t.accepted)return;let place=document.getElementById('v34MeetingText')?.value.trim()||'';if(place.length<5){alert('Bitte einen öffentlichen Treffpunkt mit mindestens fünf Zeichen angeben.');return}v34.meetings[t.id]={place:place.slice(0,140),mine:false,other:false};v34Save();render()}
function v34ApproveMeeting(role){let m=v34Meeting();if(!m.place)return;m[role]=true;v34Save();render()}
function v34MeetingPanel(t){const m=v34Meeting();return `<div class="v34-panel"><h3>Treffpunkt gemeinsam bestätigen</h3><p class="v34-small">Nur nach bestätigter Teilnahme. Einen öffentlichen Treffpunkt vorschlagen; keine Wohnadresse. Die Zustimmung der Gegenseite wird hier ausschließlich simuliert.</p>${!m.place?`<label class="trip-label">Öffentlicher Treffpunkt (nur Demo)</label><input class="trip-field" id="v34MeetingText" maxlength="140" placeholder="Zum Beispiel: Eingang Stadtpark Solingen"><button class="trip-btn" onclick="v34ProposeMeeting()">Treffpunkt vorschlagen</button>`:`<p><b>Vorschlag:</b> ${v34E(m.place)}</p><button class="trip-btn secondary" ${m.mine?'disabled':''} onclick="v34ApproveMeeting('mine')">${m.mine?'✓ Selbst bestätigt':'Treffpunkt selbst bestätigen'}</button><button class="trip-btn secondary" ${m.other?'disabled':''} onclick="v34ApproveMeeting('other')">${m.other?'✓ Gegenseite stimmt zu (Demo)':'Zustimmung der Gegenseite simulieren'}</button>${m.mine&&m.other?`<div class="v34-success">✓ Treffpunkt beidseitig bestätigt (nur Demo).</div><button class="trip-btn" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v34Meeting().place),'_blank','noopener')">Bestätigten Treffpunkt auf Google Maps ansehen</button>`:'<p class="v34-small">Noch nicht beidseitig bestätigt.</p>'}<button class="trip-btn warn" onclick="delete v34.meetings[tripActive];v34Save();render()">Vorschlag zurücknehmen</button>`}</div>`}
const v34TripDetailOld=tripDetailPage;
tripDetailPage=function(){let html=v34TripDetailOld(),t=tripFind(tripActive);if(!t)return html;let extra=v34PhotoPanel('trip-'+t.id,!!t.own);if(t.own)extra+=`<div class="v34-panel"><h3>Aktivität verwalten</h3><button class="trip-btn" onclick="v34EditActivity()">Aktivität bearbeiten</button><button class="trip-btn secondary" onclick="v34ToggleActivity()">${t.status==='cancelled'?'Wieder öffnen':'Aktivität absagen'}</button><p class="v34-small">Anfragen anderer echter Personen sind in dieser Offline-Demo nicht möglich.</p></div>${v34EditOpen?v34EditForm(t):''}`;else if(t.accepted)extra+=v34MeetingPanel(t);return html.replace('</section>',extra+'</section>')};
const v34WorkDetailOld=workDetail;
workDetail=function(){let s=v34WorkDetailOld(),a=workItem(workCurrent);if(!a)return s;return s.replace('</section>',v34PhotoPanel('job-'+a.id,!!a.mine)+'</section>')};
const v34ProfileOld=profile;
profile=function(){let s=v34ProfileOld();let reviews=Object.entries(v33.helpReviews||{}).filter(([k,r])=>k.endsWith('-helper'));let html=`<div class="v34-panel"><h3>Meine erhaltenen Hilfe-Bewertungen (Demo)</h3>${reviews.length?reviews.map(([k,r])=>`<p><b>${Number(r.stars)}/5 Sterne</b> – ${v34E(r.note)}<br><span class="v34-small">Beispielbewertung: Hilfesuchende Person</span></p>`).join(''):'<p class="v34-small">Noch keine erhaltenen Bewertungen in diesem Demoprofil.</p>'}<p class="v34-small">In der echten App erhält nur das tatsächlich bewertete Benutzerkonto die Bewertung. Lokale Simulationen sind noch nicht mit anderen Konten verbunden.</p></div>`;return s.replace('</section>',html+'</section>')};
const v34RenderOld=render;
render=function(){v34RenderOld();if(state.page==='tripdetail'){let t=tripFind(tripActive);if(t&&t.accepted&&!t.own){let c=el.querySelector('.trip-chat');if(c)c.setAttribute('aria-live','polite')}}};
</script>

<script>
// Ergänzung V34: separater demonstrativer Firmenbereich ohne echte Account-Rechte.
let v34CompanyOpen=false;
function v34CompanyPanel(){let ads=workState.ads.filter(a=>a.mine);return `<div class="v34-panel"><h3>Unternehmensbereich (Demo)</h3><p class="v34-small">Privatprofil und Firmenverwaltung sind getrennte Ansichten. In der späteren echten App dürfen nur geprüfte Firmenkonten Stellenanzeigen bearbeiten.</p><button class="work-btn" onclick="v34CompanyOpen=!v34CompanyOpen;render()">${v34CompanyOpen?'Firmenbereich schließen':'Meinen Firmenbereich öffnen'}</button>${v34CompanyOpen?`<div class="v34-edit"><label>Firmenname</label><input id="v34CompanyName" maxlength="80" value="${v34E(v34.company.name).replaceAll('"','&quot;')}"><label>Über unser Unternehmen</label><textarea id="v34CompanyAbout" maxlength="450" rows="3">${v34E(v34.company.about)}</textarea><button class="work-btn" onclick="v34SaveCompany()">Firmenprofil lokal speichern</button>${v34PhotoPanel('company-logo',true)}<h3>Meine Stellenanzeigen (${ads.length})</h3>${ads.map(a=>`<div class="v34-panel"><b>${v34E(a.title)}</b><p class="v34-small">${v34E(a.city)}</p><button class="work-btn" onclick="workOpen('${a.id}')">Anzeige verwalten</button></div>`).join('')||'<p class="v34-small">Noch keine selbst erstellten Anzeigen.</p>'}<button class="work-btn" onclick="workCurrent='';go('workcreate')">Neue Stellenanzeige erstellen</button></div>`:''}</div>`}
function v34SaveCompany(){let n=document.getElementById('v34CompanyName')?.value.trim();if(!n)return alert('Bitte einen Firmennamen eingeben.');v34.company.name=n.slice(0,80);v34.company.about=(document.getElementById('v34CompanyAbout')?.value||'').slice(0,450);v34Save();render()}
const v34WorkMainOld=workMain;
workMain=function(){return v34WorkMainOld().replace('</section>',v34CompanyPanel()+'</section>')};
</script>
</body></html>
